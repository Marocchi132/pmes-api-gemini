<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redação | PMES Pro</title><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><div class="page"><div class="box"><div class="top"><h1>Redação</h1><a class="btn outline" href="dashboard.html">Dashboard</a></div><div class="card"><h2 id="tema"></h2><p class="small">Escreva um texto dissertativo-argumentativo. A IA atribuirá nota por competência.</p><textarea id="texto" placeholder="Digite sua redação aqui..."></textarea><button class="btn primary" onclick="corrigir()">Corrigir redação</button><button class="btn outline" onclick="sortear()">Sortear tema</button><p id="msg"></p></div><div id="resultado" class="white" style="display:none"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script>const temas=['O papel da educação e da família na prevenção da violência urbana','Tecnologia e segurança pública no Brasil contemporâneo','Juventude, vulnerabilidade social e prevenção ao crime','A importância dos direitos humanos na atividade policial','Desinformação nas redes sociais e seus impactos na segurança pública'];let temaAtual='';init();async function init(){await requireLogin();sortear()}function sortear(){temaAtual=temas[Math.floor(Math.random()*temas.length)];tema.textContent=temaAtual}function render(c){resultado.style.display='block';const comp=c.competencias||{};resultado.innerHTML=`<h2>Nota ${c.origem==='ia'?'IA':'local'} ${c.nota_total}/1000</h2><div class="score"><div>C1<b>${comp.norma_culta?.nota||0}</b></div><div>C2<b>${comp.compreensao_tema?.nota||0}</b></div><div>C3<b>${comp.argumentacao?.nota||0}</b></div><div>C4<b>${comp.coesao?.nota||0}</b></div><div>C5<b>${comp.proposta_intervencao?.nota||0}</b></div></div><h3>Diagnóstico</h3><p>${c.diagnostico_geral||''}</p><h3>Sugestões</h3><ul>${(c.sugestoes||[]).map(s=>`<li>${s}</li>`).join('')}</ul>`}async function corrigir(){msg.textContent='Corrigindo...';const correcao=await api('/api/corrigir-redacao',{method:'POST',body:JSON.stringify({tema:temaAtual,redacao:texto.value})});render(correcao);await api('/api/redacoes',{method:'POST',body:JSON.stringify({tema:temaAtual,texto:texto.value,correcao})});msg.textContent='Correção salva no histórico.'}</script></body></html>

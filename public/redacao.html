<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PMES Pro — Redação</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--verde:#1a5c2e;--escuro:#0e3a1c;--dourado:#c9a227;--creme:#f4f0e6;--cinza:#e8e4d9;--erro:#c0392b;--acerto:#1a7a3a;--branco:#fff}
    *{box-sizing:border-box;margin:0;padding:0}body{font-family:Barlow,sans-serif;background:var(--escuro);color:#1a1a1a;min-height:100vh}.screen{min-height:100vh;padding:2rem;background:radial-gradient(ellipse at 20% 50%,rgba(26,92,46,.72),transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(201,162,39,.18),transparent 50%),var(--escuro);display:flex;justify-content:center;align-items:flex-start}.box{max-width:980px;width:100%;color:#fff}.top{display:flex;justify-content:space-between;gap:1rem;align-items:center;margin-bottom:1rem}.logo{font:800 2rem 'Barlow Condensed';color:var(--dourado);letter-spacing:2px;text-transform:uppercase}.nav a{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.28);border-radius:6px;padding:.55rem .8rem;margin-left:.35rem;font:700 .9rem 'Barlow Condensed';letter-spacing:1px;text-transform:uppercase}.card{background:rgba(255,255,255,.075);border:1px solid rgba(201,162,39,.35);border-radius:14px;padding:1.3rem;margin:1rem 0}.tema{font:800 1.8rem 'Barlow Condensed';color:var(--dourado);text-transform:uppercase;line-height:1.1;margin:.5rem 0 1rem}.muted{color:rgba(255,255,255,.72);line-height:1.55}.btn{border:0;border-radius:6px;cursor:pointer;text-transform:uppercase;font:800 1rem 'Barlow Condensed';letter-spacing:1.5px;padding:.9rem 1.3rem;margin:.45rem .35rem .45rem 0}.primary{background:linear-gradient(135deg,var(--dourado),#a07a10);color:var(--escuro)}.outline{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.35)}.danger{background:#7b1f1f;color:#fff}textarea{width:100%;min-height:360px;border:0;border-radius:10px;padding:1rem;font:400 1rem/1.65 Barlow,sans-serif;margin-top:1rem;resize:vertical}.rel{display:none;background:#fff;color:#222;border-radius:12px;padding:1.2rem;margin-top:1rem;line-height:1.6}.score{display:grid;grid-template-columns:repeat(5,1fr);gap:.7rem;margin:1rem 0}.score div{background:var(--creme);border-radius:8px;text-align:center;padding:.75rem}.score b{display:block;color:var(--verde);font:800 1.7rem 'Barlow Condensed'}.erro{display:none;background:#fde8e8;color:#7b0000;border-left:4px solid var(--erro);border-radius:8px;padding:1rem;margin-top:1rem}.okmsg{display:none;background:#d4edda;color:#155724;border-left:4px solid var(--acerto);border-radius:8px;padding:1rem;margin-top:1rem}.loading{opacity:.7;pointer-events:none}@media(max-width:720px){.top{align-items:flex-start;flex-direction:column}.nav a{display:inline-block;margin:.2rem .2rem}.score{grid-template-columns:1fr}.logo{font-size:1.55rem}}
  </style>
</head>
<body>
  <main class="screen">
    <div class="box">
      <div class="top">
        <div class="logo">PMES Pro — Redação</div>
        <div class="nav">
          <a href="dashboard.html">Dashboard</a>
          <a href="historico.html">Histórico</a>
          <a href="simulado.html">Simulado</a>
          <a href="login.html" id="sair">Sair</a>
        </div>
      </div>

      <section class="card">
        <p class="muted"><b>Treine sua redação discursiva.</b> O sistema sorteia um tema, envia sua produção para correção por IA e salva o resultado no histórico do aluno.</p>
        <div class="tema" id="tema"></div>
        <button class="btn outline" id="sortear">Sortear tema</button>
        <button class="btn danger" id="limpar">Limpar texto</button>
        <textarea id="texto" placeholder="Digite sua redação aqui. Recomenda-se produzir entre 20 e 30 linhas, com introdução, desenvolvimento e conclusão."></textarea>
        <button class="btn primary" id="corrigir">Corrigir redação</button>
        <div class="erro" id="erro"></div>
        <div class="okmsg" id="okmsg"></div>
        <div class="rel" id="rel"></div>
      </section>
    </div>
  </main>

<script>
const API_BASE = 'https://pmes-api-gemini.onrender.com';
const SUPABASE_PROJECT_REF = 'sryymcdthuonhfupibnl';
const AUTH_KEY = `sb-${SUPABASE_PROJECT_REF}-auth-token`;

const temas = [
  'O papel da tecnologia no fortalecimento da segurança pública no Brasil',
  'Desafios da atuação policial diante da proteção dos direitos fundamentais',
  'Violência urbana e responsabilidade compartilhada entre Estado e sociedade',
  'A importância da prevenção no enfrentamento da criminalidade juvenil',
  'Desinformação nas redes sociais e seus impactos na segurança pública',
  'Valorização profissional e eficiência das instituições policiais',
  'Educação, cidadania e redução da violência no espaço urbano',
  'O uso de câmeras corporais e transparência na atividade policial',
  'Mobilidade urbana, desigualdade territorial e policiamento preventivo',
  'Segurança pública e respeito à dignidade da pessoa humana'
];

let temaAtual = '';

function tokenSupabase(){
  try{
    const raw = localStorage.getItem(AUTH_KEY);
    if(raw){
      const data = JSON.parse(raw);
      return data.access_token || data.currentSession?.access_token || data.session?.access_token || '';
    }
  }catch(e){ console.warn('Falha lendo token padrão Supabase:', e); }

  const possibleKeys = ['pmes_token','token','access_token','supabase.auth.token'];
  for(const key of possibleKeys){
    try{
      const raw = localStorage.getItem(key);
      if(!raw) continue;
      if(raw.startsWith('ey')) return raw;
      const data = JSON.parse(raw);
      const token = data.access_token || data.currentSession?.access_token || data.session?.access_token;
      if(token) return token;
    }catch(e){}
  }

  for(let i=0;i<localStorage.length;i++){
    const key = localStorage.key(i);
    if(!key || !key.includes('auth-token')) continue;
    try{
      const data = JSON.parse(localStorage.getItem(key));
      const token = data.access_token || data.currentSession?.access_token || data.session?.access_token;
      if(token) return token;
    }catch(e){}
  }

  return '';
}

function exigirLogin(){
  const token = tokenSupabase();
  if(!token){
    alert('Sua sessão não foi encontrada. Faça login novamente.');
    window.location.href = 'login.html';
    return '';
  }
  return token;
}

function sortearTema(){
  temaAtual = temas[Math.floor(Math.random()*temas.length)];
  document.getElementById('tema').textContent = temaAtual;
  localStorage.setItem('pmes_redacao_tema', temaAtual);
}

function carregarRascunho(){
  temaAtual = localStorage.getItem('pmes_redacao_tema') || '';
  if(!temaAtual) sortearTema();
  else document.getElementById('tema').textContent = temaAtual;
  document.getElementById('texto').value = localStorage.getItem('pmes_redacao_texto') || '';
}

function numero(n){
  const v = Number(n);
  return Number.isFinite(v) ? v : 0;
}

function escapeHTML(value){
  return String(value ?? '')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'",'&#039;');
}

function itemErro(e){
  if(typeof e === 'string') return `<li>${escapeHTML(e)}</li>`;
  const trecho = e?.trecho ? `<b>${escapeHTML(e.trecho)}</b> — ` : '';
  const msg = e?.comentario || e?.problema || e?.erro || JSON.stringify(e);
  return `<li>${trecho}${escapeHTML(msg)}</li>`;
}

function itemSugestao(s){
  if(typeof s === 'string') return `<li>${escapeHTML(s)}</li>`;
  const msg = s?.sugestao || s?.comentario || s?.melhoria || JSON.stringify(s);
  return `<li>${escapeHTML(msg)}</li>`;
}

function renderResultado(r){
  const nota = numero(r.nota ?? r.nota_final ?? r.notaTotal ?? r.total);
  const c1 = numero(r.competencia1 ?? r.c1);
  const c2 = numero(r.competencia2 ?? r.c2);
  const c3 = numero(r.competencia3 ?? r.c3);
  const c4 = numero(r.competencia4 ?? r.c4);
  const c5 = numero(r.competencia5 ?? r.c5);
  const erros = Array.isArray(r.erros) ? r.erros : [];
  const sugestoes = Array.isArray(r.sugestoes) ? r.sugestoes : [];
  const comentario = r.comentario_geral || r.comentario || r.feedback || r.analise || 'Correção concluída.';

  const errosHTML = erros.length
    ? `<ul>${erros.map(itemErro).join('')}</ul>`
    : '<p>Nenhum erro específico listado pela IA.</p>';

  const sugestoesHTML = sugestoes.length
    ? `<ul>${sugestoes.map(itemSugestao).join('')}</ul>`
    : '<p>Nenhuma sugestão específica listada pela IA.</p>';

  document.getElementById('rel').style.display = 'block';
  document.getElementById('rel').innerHTML = `
    <h2>Resultado da Correção</h2>
    <p><b>Nota final:</b> ${nota}/1000</p>
    <div class="score">
      <div><span>C1</span><b>${c1}</b></div>
      <div><span>C2</span><b>${c2}</b></div>
      <div><span>C3</span><b>${c3}</b></div>
      <div><span>C4</span><b>${c4}</b></div>
      <div><span>C5</span><b>${c5}</b></div>
    </div>
    <h3>Comentário geral</h3>
    <p>${escapeHTML(comentario)}</p>
    <h3>Erros identificados</h3>
    ${errosHTML}
    <h3>Sugestões de melhoria</h3>
    ${sugestoesHTML}
  `;
}

async function salvarRedacao(token, texto, resultado){
  const nota = numero(resultado.nota ?? resultado.nota_final ?? resultado.notaTotal ?? resultado.total);
  const resp = await fetch(API_BASE + '/api/redacoes', {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'Authorization':'Bearer ' + token
    },
    body: JSON.stringify({
      tema: temaAtual,
      texto,
      nota,
      resultado
    })
  });
  const txt = await resp.text();
  console.log('REDACAO SAVE:', resp.status, txt);
  if(!resp.ok) throw new Error(txt || 'Falha ao salvar redação.');
  return txt ? JSON.parse(txt) : {};
}

async function corrigirRedacao(){
  const erro = document.getElementById('erro');
  const okmsg = document.getElementById('okmsg');
  erro.style.display = 'none';
  okmsg.style.display = 'none';

  const token = exigirLogin();
  if(!token) return;

  const texto = document.getElementById('texto').value.trim();
  if(texto.length < 200){
    erro.textContent = 'Escreva uma redação maior antes de corrigir. Use pelo menos 200 caracteres.';
    erro.style.display = 'block';
    return;
  }

  const btn = document.getElementById('corrigir');
  btn.classList.add('loading');
  btn.textContent = 'Corrigindo...';

  try{
    const resp = await fetch(API_BASE + '/api/corrigir-redacao', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':'Bearer ' + token
      },
      body: JSON.stringify({ tema: temaAtual, redacao: texto, texto })
    });

    const raw = await resp.text();
    console.log('REDACAO IA:', resp.status, raw);
    if(!resp.ok) throw new Error(raw || 'Falha na correção por IA.');

    let resultado;
    try{ resultado = JSON.parse(raw); }catch(e){ resultado = { nota:0, comentario: raw, resultado_bruto: raw }; }
    if(resultado.resultado && typeof resultado.resultado === 'object') resultado = resultado.resultado;

    renderResultado(resultado);
    await salvarRedacao(token, texto, resultado);

    localStorage.removeItem('pmes_redacao_texto');
    okmsg.textContent = 'Redação corrigida e salva no histórico com sucesso.';
    okmsg.style.display = 'block';
  }catch(e){
    console.error(e);
    erro.textContent = 'Erro ao corrigir ou salvar a redação: ' + (e.message || e);
    erro.style.display = 'block';
  }finally{
    btn.classList.remove('loading');
    btn.textContent = 'Corrigir redação';
  }
}

document.getElementById('sortear').addEventListener('click', sortearTema);
document.getElementById('limpar').addEventListener('click', ()=>{ document.getElementById('texto').value=''; localStorage.removeItem('pmes_redacao_texto'); });
document.getElementById('corrigir').addEventListener('click', corrigirRedacao);
document.getElementById('texto').addEventListener('input', e=>localStorage.setItem('pmes_redacao_texto', e.target.value));
document.getElementById('sair').addEventListener('click', ()=>{ localStorage.removeItem(AUTH_KEY); });

carregarRascunho();
exigirLogin();
</script>
</body>
</html>

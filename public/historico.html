<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Histórico | PMES Pro</title><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><div class="page"><div class="box"><div class="top"><h1>Histórico</h1><a class="btn outline" href="dashboard.html">Dashboard</a></div><div class="card"><h2>Redações</h2><div id="reds"></div></div><div class="card"><h2>Simulados</h2><div id="sims"></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script>init();async function init(){await requireLogin();const r=await api('/api/redacoes');reds.innerHTML=r.map(x=>`<div class="white"><b>${x.tema}</b><br>Nota: ${x.nota}/1000<br><small>${fmt(x.created_at)}</small></div>`).join('')||'<p>Nenhuma redação.</p>';const s=await api('/api/simulados');sims.innerHTML=s.map(x=>`<div class="white"><b>Simulado</b><br>Nota: ${x.nota} | Acertos: ${x.acertos}/${x.total}<br><small>${fmt(x.created_at)}</small></div>`).join('')||'<p>Nenhum simulado.</p>'}</script></body></html>

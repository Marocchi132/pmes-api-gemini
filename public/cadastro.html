<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro | PMES Pro</title><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><div class="page"><div class="box" style="max-width:520px"><h1>PMES Pro</h1><div class="card"><h2>Criar conta</h2><input id="nome" placeholder="Nome"><input id="email" type="email" placeholder="E-mail"><input id="senha" type="password" placeholder="Senha"><button class="btn primary" onclick="cadastrar()">Cadastrar</button><a href="login.html" class="btn outline" style="display:inline-block;text-decoration:none">Já tenho conta</a><p id="msg"></p></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script>async function cadastrar(){msg.textContent='Criando conta...';const {error}=await sb.auth.signUp({email:email.value,password:senha.value,options:{data:{nome:nome.value}}});if(error){msg.textContent=error.message;return}msg.textContent='Conta criada. Verifique o e-mail ou faça login.'}</script></body></html>

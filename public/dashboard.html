<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | PMES Pro</title><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><div class="page"><div class="box"><div class="top"><div><h1>Área do Aluno</h1><p class="small" id="aluno"></p></div><button class="btn outline" onclick="logout()">Sair</button></div><div class="grid"><div class="metric"><b id="qtdRed">0</b>Redações</div><div class="metric"><b id="mediaRed">0</b>Média Redação</div><div class="metric"><b id="qtdSim">0</b>Simulados</div><div class="metric"><b id="mediaSim">0</b>Média Simulado</div></div><div class="card"><a class="btn primary" href="redacao.html">Corrigir Redação</a><a class="btn outline" href="simulado.html">Fazer Simulado</a><a class="btn outline" href="historico.html">Histórico</a></div><div class="card"><h2>Últimas redações</h2><div id="ultimas"></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script>init();async function init(){const s=await requireLogin();aluno.textContent=s.user.email;const reds=await api('/api/redacoes');const sims=await api('/api/simulados');qtdRed.textContent=reds.length;mediaRed.textContent=reds.length?Math.round(reds.reduce((a,r)=>a+r.nota,0)/reds.length):0;qtdSim.textContent=sims.length;mediaSim.textContent=sims.length?Math.round(sims.reduce((a,r)=>a+r.nota,0)/sims.length):0;ultimas.innerHTML=reds.slice(0,5).map(r=>`<div class="white"><b>${r.tema}</b><br>Nota: ${r.nota}/1000<br><small>${fmt(r.created_at)}</small></div>`).join('')||'<p>Nenhuma redação ainda.</p>'}</script></body></html>
